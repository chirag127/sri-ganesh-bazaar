name: Android release
on:
  workflow_dispatch:
    inputs:
      approve:
        description: Approve signing of the reviewed default-branch commit
        type: boolean
        default: false
      target:
        description: Android app to sign
        type: choice
        required: true
        default: customer
        options:
          - customer
          - admin
      reviewed_sha:
        description: Full independently reviewed commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  sign:
    name: Protected Android signing
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.approve && vars.RELEASES_ENABLED == 'true'
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_ENVIRONMENT: android-release
      RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
      RELEASE_ENVIRONMENT_CONFIGURED: ${{ vars.RELEASE_ENVIRONMENT_CONFIGURED }}
      RELEASE_APPROVED: ${{ inputs.approve }}
      RELEASE_APPROVED_SHA: ${{ inputs.reviewed_sha }}
      RELEASE_PRIVACY_APPROVED: ${{ vars.RELEASE_PRIVACY_APPROVED }}
      RELEASE_DATA_SAFETY_APPROVED: ${{ vars.RELEASE_DATA_SAFETY_APPROVED }}
      RELEASE_DELETION_APPROVED: ${{ vars.RELEASE_DELETION_APPROVED }}
      RELEASE_CONTACT_APPROVED: ${{ vars.RELEASE_CONTACT_APPROVED }}
      RELEASE_DEVICE_TESTED: ${{ vars.RELEASE_DEVICE_TESTED }}
      RELEASE_BACKUP_RESTORE_TESTED: ${{ vars.RELEASE_BACKUP_RESTORE_TESTED }}
      ANDROID_TARGET: ${{ inputs.target }}
      ANDROID_CUSTOMER_APP_ID: ${{ vars.ANDROID_CUSTOMER_APP_ID }}
      ANDROID_ADMIN_APP_ID: ${{ vars.ANDROID_ADMIN_APP_ID }}
      ANDROID_APP_ID: ${{ vars.ANDROID_APP_ID }}
      ANDROID_VERSION_CODE: ${{ vars.ANDROID_VERSION_CODE }}
      ANDROID_VERSION_NAME: ${{ vars.ANDROID_VERSION_NAME }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_NEON_AUTH_URL: ${{ vars.PUBLIC_NEON_AUTH_URL }}
      PUBLIC_COMMERCE_API_URL: ${{ vars.PUBLIC_COMMERCE_API_URL }}
      PUBLIC_SHOP_PHONE: ${{ vars.PUBLIC_SHOP_PHONE }}
      PUBLIC_SHOP_ADDRESS: ${{ vars.PUBLIC_SHOP_ADDRESS }}
      PUBLIC_SHOP_HOURS: ${{ vars.PUBLIC_SHOP_HOURS }}
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      PUBLIC_ENABLE_SMS: 'false'
      PUBLIC_ENABLE_PUSH: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check && npm test && npm run test:db
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm run android:sync
        env:
          ANDROID_CUSTOMER_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_CUSTOMER_GOOGLE_SERVICES_JSON }}
          ANDROID_ADMIN_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_ADMIN_GOOGLE_SERVICES_JSON }}
      - name: Materialize upload key outside checkout
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY_BASE64"
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - run: npm run android:build -- --signed
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-${{ inputs.target }}-internal-bundle
          path: android-${{ inputs.target }}/app/build/outputs/bundle/release/app-release.aab
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/upload.jks" android-customer/app/google-services.json android-admin/app/google-services.json
